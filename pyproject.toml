[project]
name = "ece539-adaptive-study-g17"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aniketh Kancherla", email = "akancherla@wisc.edu" },
    { name = "Charlie Linville", email = "clinville@wisc.edu" },
    { name = "Quentin Schultz", email = "quentin@theschultzfamily.us" },
    { name = "Ella Wulf", email = "etwulf@wisc.edu" },
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "platformdirs>=4.14.5",
    "sqlalchemy>=2.1.8",
    "torch>=2.15.0",
]
license = "AGPL-3.0-or-later"
license-files = [
    "LICENSE",
]


[project.scripts]
ece539-adaptive-study-g17 = "ece539_adaptive_study_g17:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "licensecheck>=2026.0.8",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
